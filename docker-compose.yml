# Forge — all-in-one. ONE container carries Forge + its matched MMA engine
# (pinned at package.json#matchedMmaVersion, run as a loopback co-process). There
# is no separate MMA service: MMA is loopback-only and lives inside this container,
# so reachability, the shared bearer token, and workspace file identity are all
# internal and need no wiring.
#
# Database: bring your own by default — point DATABASE_URL at a managed Postgres.
# For a one-command demo instead, start the optional local database too:
#   docker compose --profile postgres up -d
#   # then set DATABASE_URL=postgres://forge:forge@postgres:5432/forge in your .env
services:
  forge:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        FORGE_BUILD_GIT_SHA: ${FORGE_BUILD_GIT_SHA:-unknown}
        FORGE_BUILD_BUILT_AT: ${FORGE_BUILD_BUILT_AT:-unknown}
    image: ghcr.io/zhixuan312/forge:${FORGE_IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      FORGE_SECRET_KEY: ${FORGE_SECRET_KEY:?set FORGE_SECRET_KEY}

      # Provider config is managed in the app (Settings → Models, org-admin), which
      # calls MMA's /configure-provider and persists per-tier provider/model/endpoint/
      # key to the MMA config volume below. These env vars are an OPTIONAL FIRST-BOOT
      # SEED only — they generate the initial config when none exists yet; thereafter
      # the UI is authoritative. Leave them empty to configure entirely in the UI.
      # PROVIDER is the default protocol for every tier; PROVIDER_<TIER> overrides one
      # tier (mixed claude/codex layouts work). Each tier reads its OWN provider's key.
      PROVIDER: ${PROVIDER:-}
      PROVIDER_STANDARD: ${PROVIDER_STANDARD:-}
      PROVIDER_COMPLEX: ${PROVIDER_COMPLEX:-}
      PROVIDER_MAIN: ${PROVIDER_MAIN:-}
      MODEL_STANDARD: ${MODEL_STANDARD:-}
      MODEL_COMPLEX: ${MODEL_COMPLEX:-}
      MODEL_MAIN: ${MODEL_MAIN:-}
      BASE_URL_STANDARD: ${BASE_URL_STANDARD:-}
      BASE_URL_COMPLEX: ${BASE_URL_COMPLEX:-}
      BASE_URL_MAIN: ${BASE_URL_MAIN:-}
      # Name the env var holding each tier's key. Needed for vendors that speak a
      # standard protocol behind their own endpoint (DeepSeek, Z.ai/GLM, Kimi, MiniMax).
      API_KEY_ENV_STANDARD: ${API_KEY_ENV_STANDARD:-}
      API_KEY_ENV_COMPLEX: ${API_KEY_ENV_COMPLEX:-}
      API_KEY_ENV_MAIN: ${API_KEY_ENV_MAIN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

      # Session-cookie transport. Blank (the default) marks the cookie Secure in
      # production, which is correct behind a TLS proxy. Serving Forge directly over
      # plain HTTP with Secure on makes the browser DISCARD the cookie: login succeeds
      # server-side but the user is silently bounced back to /login. Set
      # FORGE_COOKIE_SECURE=false in that case — see DEPLOYMENT.md §2.
      FORGE_COOKIE_SECURE: ${FORGE_COOKIE_SECURE:-}
    networks:
      - forge-net
    ports:
      - "${FORGE_PORT:-3000}:3000"
    volumes:
      # Workspace BASE (FORGE_WORKSPACE_BASE=/workspace). Forge is multi-team: each
      # team's workspace is a direct child (/workspace/<team>) that the bundled MMA
      # operates in. A named volume persists every team's dir across restarts; swap
      # for a host path (e.g. /srv/forge-workspace) to keep it on the host filesystem.
      - forge-workspace:/workspace
      # MMA config + bearer. Persists the per-tier provider config set in Settings →
      # Models across container recreation (upgrades). Without this, UI-configured
      # providers are lost when the container is replaced.
      - forge-mma-config:/home/node/.mma
      # OAuth (optional): mount your host creds read-only for keyless tiers.
      # - ${HOME}/.claude:/home/node/.claude:ro
      # - ${HOME}/.codex:/home/node/.codex:ro
    restart: unless-stopped

  # Optional local database for a one-command demo — enable with:
  #   docker compose --profile postgres up -d
  postgres:
    image: postgres:17
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: forge
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
    networks:
      - forge-net
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

networks:
  forge-net:
    driver: bridge

volumes:
  forge-workspace:
  forge-mma-config:
  postgres-data:
